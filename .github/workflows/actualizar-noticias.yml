name: Actualizar noticias del club

on:
  schedule:
    - cron: "17 * * * *"   # cada hora, al minuto 17
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write           # necesario para guardar el archivo actualizado

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer las noticias de herediano.com
        run: python scripts/actualizar_noticias.py

      - name: Guardar cambios (solo si hay noticias nuevas)
        run: |
          if [ -n "$(git status --porcelain data/noticias-club.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/noticias-club.json
            git commit -m "Actualizar noticias del club"
            git push
          fi
